name: Repository maintenance contracts

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Reject private installation artifacts
        run: python tests/private-artifact-boundary.py
      - name: Mocked contracts only; no cluster access
        run: |
          python tests/host-provisioning.py
          python tests/host-maintenance.py
          python tests/host-recovery.py
          python tests/velero-recovery.py
          python tests/maintenance-bootstrap.py
          python tests/maintenance-contract.py
          bash -n install.sh configure.sh maintain.sh maintenance.sh provision-host.sh
          git diff --check
